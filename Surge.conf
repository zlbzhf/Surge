[Rule]
# =============================================================
# SukkaW Ruleset comprehensive layout
# 规则顺序必须是全局 domainset -> non_ip -> ip -> FINAL。
# 本段尽量罗列 SukkaW README 中所有公开分类；高风险/重型/按需项默认注释保留。
# 取消注释前请确认对应策略组存在，或把策略名改成你自己的策略组。
# =============================================================

# =============================================================
# 1. Domainset rules: no DNS resolve
# =============================================================

# > 广告拦截 / 隐私保护 / Malware / Phishing
# > 基础 reject 可按需开启；reject_extra / reject_phishing 规则量更大，移动端谨慎。
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_phishing.conf,REJECT

# > Speedtest 测速域名
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/speedtest.conf,Speedtest,extended-matching

# > 常见静态 CDN / 对象存储
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,Proxy

# > Apple CDN：中国大陆备案 Apple CDN，通常建议直连
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT

# > 软件更新、操作系统等大文件下载
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,Download

# > 游戏/大文件下载相关域名
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/game-download.conf,Game

# > iCloud Private Relay：如需特殊处理可开启；大陆日常一般保持注释
# DOMAIN-SET,https://ruleset.skk.moe/List/domainset/icloud_private_relay.conf,Apple


# =============================================================
# 2. Non-IP rules: no DNS resolve
# =============================================================

# > 广告拦截 / 隐私保护 / Malware / Phishing
# > reject-drop 适合明确应直接丢弃的连接；基础 reject 可按需开启。
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching
# > URL-REGEX 需要 MITM，性能开销和误伤风险高，不建议日常开启。
# RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-url-regex.conf,REJECT

# > 搜狗输入法隐私保护：会影响账号同步、词库更新、问题反馈，按需开启
# RULE-SET,https://ruleset.skk.moe/List/non_ip/sogouinput.conf,REJECT

# > GitLab：项目实际存在但 README 主示例未重点展开；GitLab forbids usage from CN, HK, MO，按需走 Proxy。
# RULE-SET,https://ruleset.skk.moe/List/non_ip/gitlab.conf,Proxy

# > 明确应该直连的特殊服务，建议靠前
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT

# > AI / AIGC
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,AIGC
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,AIGC,extended-matching

# > Telegram 域名规则；SukkaW 更推荐 IP CIDR，域名规则可作为补充
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Telegram

# > blackmatrix7 单 App 补充规则（由 scripts/generate.py 拆分生成）
# > 本段只引用本仓库生成的 non_ip 列表；上游 mixed list 中的 IP-CIDR 会进入后面的 IP 区域。
# > 独立 App 策略组只用于功能/解锁/IP 风控确有差异的服务，不为了细分而细分。
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/PayPal.non_ip.list,PayPal
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/GitHub.non_ip.list,GitHub
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/YouTube.non_ip.list,YouTube
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/Netflix.non_ip.list,Netflix
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/Disney.non_ip.list,Disney+
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/Spotify.non_ip.list,Spotify
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/TikTok.non_ip.list,TikTok

# > Apple
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple

# > Microsoft
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,Microsoft

# > 网易云音乐
RULE-SET,https://ruleset.skk.moe/List/non_ip/neteasemusic.conf,DIRECT

# > 软件更新、操作系统等大文件下载
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,Download

# > 常见静态 CDN / 对象存储
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,Proxy

# > 流媒体：SukkaW 按地区分组，作为未被 blackmatrix7 单 App 命中的兜底
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_us.conf,Streaming-US
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_eu.conf,Streaming-EU
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_jp.conf,Streaming-JP
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_kr.conf,Streaming-KR
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_hk.conf,Streaming-HK
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_tw.conf,Streaming-TW
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,GlobalMedia

# > 内网域名：Surge 也有内置 LAN；这里保留 SukkaW non_ip 版本
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT

# > 国内 / 全球 / 直连核心规则
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,Proxy


# =============================================================
# 3. IP rules: may trigger DNS resolve; keep after all domain/non-ip rules
# =============================================================

# > 广告 / 恶意 IP 拦截：较激进，默认关闭
# RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP

# > blackmatrix7 单 App IP 规则（由 scripts/generate.py 拆分生成）
# > 与上方 non_ip 列表配套，保持全局 domainset -> non_ip -> ip 顺序。
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/YouTube.ip.list,YouTube
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/Netflix.ip.list,Netflix
RULE-SET,https://raw.githubusercontent.com/zlbzhf/Surge/main/rules/blackmatrix7/Spotify.ip.list,Spotify

# > Telegram IP CIDR / ASN
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,Telegram
# > ASN 仅作为补充；如遇匹配异常可重新注释
